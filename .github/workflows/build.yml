name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :core:test :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk shake-n-back-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shake-n-back-debug-apk
          path: shake-n-back-debug.apk
      # Rolling pre-release: the download URL stays the same and always points
      # at the latest push.
      - name: Publish latest build as a release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build shake-n-back-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (#${GITHUB_RUN_NUMBER})" \
            --notes "Debug build of ${GITHUB_SHA::7} from \`${GITHUB_REF_NAME}\`. Install shake-n-back-debug.apk on your Android device."
